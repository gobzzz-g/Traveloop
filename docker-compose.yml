version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: traveloop
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/traveloop
      - JWT_SECRET=your-super-secret-jwt-key-min-32-chars
      - JWT_REFRESH_SECRET=your-refresh-token-secret-different-from-jwt
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - API_PREFIX=/api
      # Add other environment variables here like GEMINI_API_KEY
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
